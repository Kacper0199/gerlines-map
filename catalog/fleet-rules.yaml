# Fleet rules of the vehicle identity (ADR-0011, architecture section 9). Scope line feeds layer L2
# (Typical for this line), scope operator layer L3 (Typical for this operator, the series with the
# largest share of the operator's fleet as its source counts it), scope category layer L4 (Generic
# model). Every row cites the revision it was read from (sources.yaml) and quotes the cell or
# sentence in evidence; a line no source describes has no row. Lines compare in upper case without
# spaces. Rows from current articles are valid for the timetable year of the revision (14 December
# 2025 to 12 December 2026) and must be read again after the next timetable change; a row quoting a
# dated count is valid from that date.
# The ice-line rows are generated by `gerlines-catalog fleet-ice-lines --source wikipedia-de-ice-linien
# --valid-from 2025-12-14 --valid-to 2026-12-12`; the mapping of linked articles to series is
# ARTICLE_SERIES in pipelines/catalog (the ICE 3 article covers 403, 406, 407 and 408, the ICE T
# article 411 and 415, the Railjet article both generations). The block of IC, Railjet, RE and RB
# lines is generated by `gerlines-catalog fleet-ic-regional-lines` (its header names the arguments)
# from the cited revisions of the IC, Intercity 2, ICE and Länder line list articles; its evidence
# is adapted from those articles (CC BY-SA 4.0): markup and references removed, the lines of a cell
# joined with semicolons and rows with a bar. Validated by gerlines-catalog.

