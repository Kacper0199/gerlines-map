        screen_bottom_setback_m: 0.95
        screen_top_setback_m: 3.45
        screen_width: 0.5
        plan: round
        stripe: none
        screen_widths: [[2.0, 0.42], [2.6, 0.55], [3.1, 0.5], [3.45, 0.3]]
        screen_round: 4.0
        side_profile: [[1.6, 0.3], [0.9, 0.33], [0.6, 0.37], [0.35, 0.45], [0.2, 0.53], [0.08, 0.63], [0.02, 0.74], [0, 0.86], [0.04, 1.0], [0.09, 1.1], [0.14, 1.18], [0.24, 1.31], [0.34, 1.43], [0.54, 1.64], [0.75, 1.84], [0.95, 2.02], [1.16, 2.19], [1.46, 2.4], [1.87, 2.7], [2.27, 2.91], [2.68, 3.11], [3.09, 3.3], [3.49, 3.48], [4.0, 3.63], [4.5, 3.72], [5.0, 3.79], [5.5, 3.84], [6.0, 3.875], [6.6, 3.89]]
        plan_widths: [[0.3, 0.51], [0.6, 0.65], [0.9, 0.73], [1.2, 0.8], [1.5, 0.84], [1.8, 0.88], [2.1, 0.92], [2.4, 0.96], [2.7, 0.99], [2.9, 1.0]]
        decals:
