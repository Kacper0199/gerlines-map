        estimated: [screen_width, screen_widths, screen_round, plan, bottom_setback_m, stripe, decals]
      source: wikipedia-de-403
      field_sources:
        nose_shape: gerlines
      missing:
        floor_height_m: &no-floor the cited source gives no floor height
        wheel_diameter_m: &no-wheel the cited source gives no wheel diameter
        bogie_offset_m: &no-offset the cited source gives the pivot distance, not where the pivots sit in the car
        nose_length_m: &unmeasured not measured yet, no side drawing or photo measured in WP-5.1
        doors_per_side: &no-doors the cited source does not count the doors per car and side
        door_positions_m: *unmeasured
        window_sill_m: *unmeasured
        window_top_m: *unmeasured
        pantograph_count: &generic-no-pantograph a generic model draws no pantographs
        bogie_wheelbase_m: &no-wheelbase the cited source gives no bogie wheelbase
        door_width_m: &no-door-width the cited source gives no door width
