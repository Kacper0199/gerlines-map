# Geometry of the vehicle forge (tools/trainforge): per model the car sequence of one typical
# unit, per car type the measures the forge needs. Every value names its source (source, and
# field_sources for single fields, rows of sources.yaml) or stays empty with the reason in
# missing; the forge then uses a stylisation default and lists the field as estimated in the
# glTF extras. Lengths are over couplers (articulated cars: joint to joint), heights above top of
# rail, positions along the car in metres from the car centre with forward positive. nose_shape
# is our classification of the cab front (source gerlines). Lengths a source gives only for the
# whole unit, or that follow from two sourced unit lengths, are explained in the source note.
# Validated by gerlines-catalog.

# ---- Generic models per category (layer L4): dimensions of one named series, generic shape.

- model_id: generic-hsr
  name: Generic high speed train
  generic: true
  category: hsr
  unit_length_m: 200.84
  length_gap_reason: &ice3-gap the article gives car lengths that add up to 200,32 m against its unit length of 200,84 m, the forge keeps the car lengths
  formation:
    - car_type: end
    - car_type: middle
    - car_type: middle
    - car_type: middle
    - car_type: middle
    - car_type: middle
    - car_type: middle
    - car_type: end
      reversed: true
  source: wikipedia-de-403
  missing:
