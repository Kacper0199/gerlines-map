# Sources of the catalogue. Every row of every seed file names one of these (source, and
# field_sources for single fields); the licence is an SPDX expression.
- source_id: gerlines
  name: GerLines catalogue curation
  homepage_url: https://github.com/Kacper0199/gerlines-map
  licence: CC0-1.0
  licence_url: https://creativecommons.org/publicdomain/zero/1.0/
  attribution: GerLines contributors
  note: >-
    Our own definitions and choices: category names, which Wikidata item fits an operator,
    series keys and priorities chosen by hand, countries derived by the static import's
    operator rules, the series family chosen by hand, and the mapping from Wikidata rail vehicle
    classes to unit kind and traction (series_classes.py). Licence CC0-1.0.
- source_id: delfi-gtfs
  name: DELFI national GTFS timetable
  homepage_url: https://www.opendata-oepnv.de/ht/de/organisation/delfi/startseite
  licence: CC-BY-4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  attribution: DELFI e.V.
  note: Same row as the static import writes. Agency names of the feed of 2026-10-19.
- source_id: wikidata
  name: Wikidata
  homepage_url: https://www.wikidata.org/
  licence: CC0-1.0
  licence_url: https://creativecommons.org/publicdomain/zero/1.0/
  attribution: Wikidata contributors
  note: >-
    Read through the SPARQL endpoint on 2026-10-25; the queries and answers are cached under
    data/catalog/wikidata/ with sidecars.
- source_id: wikidata-search
  name: Wikidata entity search, choice reviewed by a GerLines contributor
  homepage_url: https://www.wikidata.org/w/api.php?action=help&modules=wbsearchentities
  licence: CC0-1.0
  licence_url: https://creativecommons.org/publicdomain/zero/1.0/
  attribution: Wikidata contributors and GerLines contributors
  note: >-
    The operator's agency name was searched (EntitySearch through the SPARQL endpoint,
    2026-10-25, cached under data/catalog/wikidata/search-operators-*) and the item whose
    label and description name the operating company or brand was chosen by hand.
- source_id: traewelling-operator-matching
  name: Träwelling transitous-wikidata-operator-matching, mapping.csv
