  licence: CC0-1.0
  licence_url: https://creativecommons.org/publicdomain/zero/1.0/
  attribution: Träwelling contributors
  note: Maps DELFI agency ids (as MOTIS operator ids) to Wikidata items. Commit 7f63ac5a.
