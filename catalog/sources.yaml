- source_id: commons-falk2-dbpbzfa-668-side
  name: Wikimedia Commons, J24 219 DBpbzfa 668.2, Führerstandsseite.jpg (Falk2)
  homepage_url: https://commons.wikimedia.org/wiki/File:J24_219_DBpbzfa_668.2,_F%C3%BChrerstandsseite.jpg
  licence: CC-BY-SA-4.0
  licence_url: https://creativecommons.org/licenses/by-sa/4.0/
  attribution: Falk2, via Wikimedia Commons
  note: >-
    Side-on view of the cab end of an Intercity 2 driving trailer (nose to the left), read (method
    measured) on the 3840 × 2560 rendition retrieved 2026-11-06, points taken on a 1400 px copy: 164 px
    per metre there from the roof y 57 = 4.632 m (sourced height) and the rail y 817; body tip x
    160 (the coupler head left out). Nose centreline (profile_by_height): the face stands almost upright
    from 0.77 m to 2.24 m (0.15 m back), the cab roof curves back over 2.4 m to the roof height,
    the grey lower nose reaches down to 0.12 m from 0.6 m behind the tip; the red stripe meets the
    front at 1.08 m to 1.24 m, just above the coupler. A close photo: the wheels read smaller than
    the sourced 0.92 m because they sit inside the side plane, so heights carry about 5 %
    uncertainty.
