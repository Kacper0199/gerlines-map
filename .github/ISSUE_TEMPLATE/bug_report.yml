name: Bug report
description: Something in GerLines does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the web client against a live replay
        2. Select a train near Köln
        3. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser and version, Node and pnpm versions if you ran it locally.
  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: Remove keys, tokens and personal data first.
      render: text
