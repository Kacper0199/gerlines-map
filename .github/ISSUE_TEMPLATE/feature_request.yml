name: Feature or change
description: Propose a feature or a larger change before you work on it.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you want to do with GerLines and cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Check docs/PLAN.md first, it may already be planned.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and licences
      description: New data sources need an open licence that allows redistribution. Name the source and its licence.
