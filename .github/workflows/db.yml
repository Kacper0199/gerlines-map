name: Database

on:
  push:
    branches: [main]
    paths:
      - services/ingest/**
      - services/live/**
      - apps/api/**
      - pipelines/**
      - catalog/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - packages/db/**
      - packages/geo/**
      - packages/live-frame/**
      - packages/schema/**
      - packages/config/**
      - infra/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/db.yml
  pull_request:
    branches: [main]
    paths:
      - services/ingest/**
      - services/live/**
      - apps/api/**
      - pipelines/**
      - catalog/**
      - pyproject.toml
      - uv.lock
      - .python-version
      - packages/db/**
      - packages/geo/**
      - packages/live-frame/**
      - packages/schema/**
      - packages/config/**
      - infra/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/db.yml

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: Migrations and database tests against TimescaleDB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: timescale/timescaledb-ha:pg18.6-ts2.31.0@sha256:ad8b5095c9e9f19b3c97794133f1dd80f09da9566a5687f79b6208324b98a388
        env:
          POSTGRES_USER: gerlines
          POSTGRES_PASSWORD: change-me-locally
          POSTGRES_DB: gerlines
          TIMESCALEDB_TELEMETRY: "off"
          NO_TS_TUNE: "true"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U gerlines -d gerlines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_USER: gerlines
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: gerlines
      GERLINES_DB_TESTS: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Raise the database worker limits to match infra/compose.yaml
        env:
          DB_CONTAINER: ${{ job.services.db.id }}
        run: |
          docker exec "$DB_CONTAINER" psql -U gerlines -d gerlines -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_worker_processes = 32" \
            -c "ALTER SYSTEM SET max_parallel_workers = 4" \
            -c "ALTER SYSTEM SET timescaledb.max_background_workers = 24"
          docker restart "$DB_CONTAINER"
          for _ in $(seq 1 60); do
            if [ "$(docker exec "$DB_CONTAINER" psql -U gerlines -d gerlines -Atc 'SHOW max_worker_processes' 2>/dev/null)" = "32" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "database did not come back with max_worker_processes = 32" >&2
          exit 1

      - name: Integration tests (throwaway database, migrations, constraints, type drift)
        run: pnpm db:test

      - name: Recorder index integration test (throwaway database)
        run: pnpm --filter @gerlines/ingest test:integration

      - name: Live reader integration test against the realtime writer (throwaway database)
        run: pnpm --filter @gerlines/live test:integration

      - name: Search index integration test (throwaway database)
        run: pnpm --filter @gerlines/api test:integration

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
          cache-python: true

      - name: Python database tests (throwaway databases)
        run: |
          uv sync --locked
          uv run --frozen pytest -m db --ignore=pipelines/rail_graph

      - name: Migrate up, down and up again through the CLI
        run: |
          pnpm db:migrate
          pnpm db:rollback --steps 4
          pnpm db:migrate
          pnpm db:status
