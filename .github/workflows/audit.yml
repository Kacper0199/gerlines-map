name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Production dependencies, high and critical advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Node production dependencies (pnpm audit over pnpm-lock.yaml)
        run: pnpm audit --prod --audit-level high

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ !cancelled() }}
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Severity filter tests
        if: ${{ !cancelled() }}
        run: node --test scripts/check-pip-audit.test.mjs

      - name: Python production dependencies (pip-audit over uv.lock)
        if: ${{ !cancelled() }}
        run: |
          requirements="$RUNNER_TEMP/requirements.txt"
          report="$RUNNER_TEMP/pip-audit.json"
          uv export --quiet --frozen --all-packages --no-dev --no-emit-workspace --format requirements-txt -o "$requirements"
          status=0
          uvx --from "pip-audit==${PIP_AUDIT_VERSION}" pip-audit -r "$requirements" --disable-pip --require-hashes \
            --progress-spinner off --format json -o "$report" || status=$?
          if [ ! -s "$report" ]; then
            echo "pip-audit wrote no report (exit $status)"
            exit 1
          fi
          node scripts/check-pip-audit.mjs "$report"
