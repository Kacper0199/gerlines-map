version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "oxc-transform-react"
        versions: [">=0.153"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      containers:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/ingest
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: node
        versions: [">=25"]
    groups:
      recorder-image:
        patterns: ["*"]
