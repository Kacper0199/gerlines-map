[project]
name = "gerlines-geo-base"
version = "0.1.0"
description = "Germany outline and mask, the 16 Länder and the neighbour countries for the GerLines map"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
  "gerlines-common",
  "numpy==2.5.4",
  "pyogrio==0.13.0",
  "pyproj==3.8.0",
  "shapely==2.2.0",
]

[project.scripts]
geo-base = "gerlines_geo_base.cli:main"

[tool.uv.sources]
gerlines-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
