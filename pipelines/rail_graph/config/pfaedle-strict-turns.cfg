# pfaedle parameters for the alternate run of P-T102-01 (passed with -P on top of the image's pfaedle.cfg).
# A full turn costs 30 minutes instead of 3, so a hop no longer turns back at a junction between two stops.
# Used only for the legs that `extract-pfaedle --alternate` splices in: the same penalty also charges the
# reversal at a stop between two hops, so this run alone would lose real reversals (Frankfurt Hbf).
[rail]
routing_full_turn_penalty: 1800
